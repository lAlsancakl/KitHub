        <!-- 2. ORTA SÜTUN: Giriş Yap (Log In) -->
<main class="main-feed">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Log in to your KitHub account to continue.</p>
            </div>

            <form action="/login" method="POST" class="auth-form">
                <!-- Username -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password_hash">Password</label>
                    <input type="password" id="password_hash" name="password_hash" placeholder="••••••••" required>
                </div>

                <button type="submit" class="submit-btn">Log In</button>
            </form>

            <div class="auth-footer">
                <span>Don't have an account? <a href="signup.html">Sign Up</a></span>
            </div>
        </div>
    </div>
</main>

        <!-- 3. SAĞ SÜTUN: Öneriler / Arama / Trendler -->
        <aside class="sidebar-right">
            
        </aside>

        <!-- İKİ AYRI MODAL YAPISI (Sayfa sonuna, </body> etiketinin üstüne konulacak) -->

    <div class="kithub-modal-box">
        <div class="kithub-modal-header">
            <h3>Create a Review</h3>
            <button type="button" class="modal-close-btn" data-close="reviewModal">&times;</button>
        </div>
        <div class="kithub-modal-body">
            asd

    </div>

        </div>

            asd
        </div>
    </div>
        </div>
